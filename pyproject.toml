[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-multi-cad-agent"
version = "0.4.0"
description = "Local, verifiable foundations for an AI multi-CAD agent"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.26,<2", "jsonschema>=4.20"]

[project.scripts]
multi-cad = "multi_cad.cli:main"
multi-cad-mcp = "multi_cad.gateway:main"

[tool.setuptools.packages.find]
include = ["multi_cad*"]
