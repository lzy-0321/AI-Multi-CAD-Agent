name: Windows candidate release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (for example v0.3.0rc1)
        required: true
        type: string

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[mcp]"
      - run: python -m unittest discover -v

  publish:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Verify tag matches the candidate version
        shell: python
        run: |
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'Tag and package version differ'
          assert 'rc' in version, 'This workflow publishes release candidates only'
          assert pathlib.Path('docs/releases/' + os.environ['RELEASE_TAG'] + '.md').is_file()
      - name: Build wheel and ZIP
        run: python scripts/build_release.py
      - name: Install, upgrade, fail safely, and roll back without CAD
        run: |
          $archive = (Get-ChildItem dist -Filter 'MultiCAD-*-windows.zip').FullName
          python scripts/check_release_install.py $archive --destination "$env:RUNNER_TEMP\MultiCAD acceptance"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath "$env:RUNNER_TEMP\MultiCAD acceptance\installation-acceptance.json" -Destination dist
      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $assets = Get-ChildItem dist -File | Where-Object { $_.Name -match '\.(zip|sha256|whl)$' -or $_.Name -eq 'installation-acceptance.json' } | ForEach-Object { $_.FullName }
          gh release create $env:RELEASE_TAG @assets --verify-tag --prerelease --title "Multi-CAD $env:RELEASE_TAG (Windows candidate)" --notes-file "docs/releases/$env:RELEASE_TAG.md"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
