name: Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag matching pyproject.toml (for example v0.3.1 or v0.3.1rc1)
        required: true
        type: string

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[mcp]"
      - run: python -m unittest discover -v

  publish:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Validate release identity and type
        id: metadata
        run: python scripts/release_metadata.py --tag "$env:RELEASE_TAG"
      - name: Build wheel and ZIP
        run: python scripts/build_release.py
      - name: Install, upgrade, fail safely, and roll back without CAD
        run: |
          $archive = (Get-ChildItem dist -Filter 'MultiCAD-*-windows.zip').FullName
          python scripts/check_release_install.py $archive --destination "$env:RUNNER_TEMP\MultiCAD acceptance"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath "$env:RUNNER_TEMP\MultiCAD acceptance\installation-acceptance.json" -Destination dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          IS_PRERELEASE: ${{ steps.metadata.outputs.prerelease }}
        run: |
          $assets = Get-ChildItem dist -File | Where-Object { $_.Name -match '\.(zip|sha256|whl)$' -or $_.Name -eq 'installation-acceptance.json' } | ForEach-Object { $_.FullName }
          $releaseOptions = @('--verify-tag', '--title', "Multi-CAD $env:RELEASE_TAG (Windows)", '--notes-file', "docs/releases/$env:RELEASE_TAG.md")
          if ($env:IS_PRERELEASE -eq 'true') { $releaseOptions += '--prerelease' }
          gh release create $env:RELEASE_TAG @assets @releaseOptions
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
